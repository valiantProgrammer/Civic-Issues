<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e293b;#0a192f;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#2563eb;#1d4ed8;#1e3a8a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#0369a1;#0f172a;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Animated Map Wave Lines -->
  <path d="M 0,220 C 300,180 600,260 900,210 C 1050,185 1150,230 1200,220" fill="none" stroke="rgba(147, 197, 253, 0.25)" stroke-width="2">
    <animate attributeName="d" values="M 0,220 C 300,180 600,260 900,210 C 1050,185 1150,230 1200,220; M 0,210 C 300,250 600,190 900,240 C 1050,210 1150,190 1200,210; M 0,220 C 300,180 600,260 900,210 C 1050,185 1150,230 1200,220" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Pulsing Map Pin 1 -->
  <g transform="translate(220, 140)">
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="6;26" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pulsing Map Pin 2 -->
  <g transform="translate(980, 160)">
    <circle cx="0" cy="0" r="6" fill="#34d399" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="6;24" dur="2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pulsing Map Pin 3 -->
  <g transform="translate(860, 90)">
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="5;20" dur="2.2s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2.2s" begin="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title & Typography -->
  <g id="brand-text">
    <text x="600" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="1.5" filter="url(#glow)">Civic साथी</text>
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="2">MUNICIPAL GRIEVANCE REDRESSAL PLATFORM</text>
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="1">Next.js 15 • React 19 • MongoDB Atlas • MapLibre GL • AI Triage</text>
  </g>
</svg>
