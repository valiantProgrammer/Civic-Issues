<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Expanding outer ripple -->
  <circle cx="8" cy="8" r="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.8">
    <animate attributeName="r" values="3.5;7.5" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <!-- Static / glowing core -->
  <circle cx="8" cy="8" r="3.5" fill="#10b981" />
</svg>
