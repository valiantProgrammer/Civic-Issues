<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 4" width="100%" height="4">
  <defs>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <!-- Base track -->
  <line x1="0" y1="2" x2="1000" y2="2" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
  <!-- Scanning highlight -->
  <line x1="0" y1="2" x2="1000" y2="2" stroke="url(#scanGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
